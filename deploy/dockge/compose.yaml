# Fælleskassen — Dockge + Pangolin
#
# Ingen værts-porte. Containeren sidder på det eksterne netværk `proxy`.
# I Pangolin: HTTP-resource → http://faelleskassen:8080

services:
  faelleskassen:
    container_name: faelleskassen
    image: ${IMAGE:-ghcr.io/kirederb-vibing/cursor:latest}
    pull_policy: always
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      DATA_DIR: /data
      TZ: ${TZ:-Europe/Copenhagen}
      API_KEY: ${API_KEY}
      SEED_DEMO: ${SEED_DEMO:-false}
      PUBLIC_URL: ${PUBLIC_URL:-http://faelleskassen:8080}
    volumes:
      - data:/data
    networks:
      - proxy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  data:

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
