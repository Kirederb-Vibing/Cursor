# Fælleskassen — Dockge-stack
#
# 1. Ny stack i Dockge, navn: faelleskassen
# 2. Indsæt denne fil som compose
# 3. Indsæt .env i Env-fanen
# 4. Deploy
#
# Branchen er ikke merged til main endnu, så stacken bygger image
# direkte fra GitHub. Når latest ligger i GHCR, kan du skifte til
# image: ghcr.io/kirederb-vibing/cursor:latest og fjerne build.

services:
  faelleskassen:
    container_name: faelleskassen
    image: faelleskassen:test
    pull_policy: build
    build:
      context: https://github.com/Kirederb-Vibing/Cursor.git#cursor/oekonomi-planlaegning-800c
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      DATA_DIR: /data
      TZ: ${TZ:-Europe/Copenhagen}
      API_KEY: ${API_KEY}
      APP_PASSWORD: ${APP_PASSWORD:-}
      SEED_DEMO: ${SEED_DEMO:-true}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
    volumes:
      - data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  data:
