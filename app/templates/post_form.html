{% extends "base.html" %}
{% block title %}{% if item %}Rediger{% else %}Ny post{% endif %} · Fælleskassen{% endblock %}
{% block body %}
<section class="hero compact">
  <div>
    <p class="eyebrow">Post</p>
    <h1>{% if item %}{{ item.name }}{% else %}Ny post{% endif %}</h1>
  </div>
</section>

<section class="card form-card">
  <form method="post" action="{% if item %}/poster/{{ item.id }}{% else %}/poster{% endif %}" class="stack">
    <label>
      Type
      <select name="kind" id="kind">
        {% for key, label in kind_labels.items() %}
        <option value="{{ key }}" {% if (item.kind if item else default_kind) == key %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </label>
    <label>
      Navn
      <input name="name" required value="{{ item.name if item else '' }}" placeholder="Netflix, løn, opsparing…">
    </label>
    <div class="row">
      <label>
        Beløb (DKK)
        <input name="amount" required value="{{ '%.2f'|format(item.amount_ore/100) if item else '' }}" inputmode="decimal">
      </label>
      <label>
        Kadence
        <select name="cadence" id="cadence">
          {% for key, label in cadence_labels.items() %}
          <option value="{{ key }}" {% if (item.cadence if item else 'monthly') == key %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </label>
    </div>
    <div class="row">
      <label>
        Hvornår hæves den
        <select name="charge_rule" id="charge_rule">
          {% for key, label in charge_labels.items() %}
          <option value="{{ key }}" {% if (item.charge_rule if item else 'day_of_month') == key %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </label>
      <label id="day_wrap">
        Dag i måneden
        <input name="charge_day" type="number" min="1" max="31" value="{{ item.charge_day if item and item.charge_day else 1 }}">
      </label>
      <label id="anchor_wrap">
        Første måned i cyklussen
        <select name="anchor_month">
          {% for i in range(1,13) %}
          <option value="{{ i }}" {% if (item.anchor_month if item else 1) == i %}selected{% endif %}>{{ months[i] }}</option>
          {% endfor %}
        </select>
      </label>
    </div>
    <div class="row">
      <label>
        Starter
        <input type="date" name="starts_on" required value="{{ item.starts_on.isoformat() if item else today }}">
      </label>
      <label>
        Slutter (tom = kører indtil den fjernes)
        <input type="date" name="ends_on" value="{{ item.ends_on.isoformat() if item and item.ends_on else '' }}">
      </label>
    </div>
    <div class="row">
      <label>
        Person
        <select name="person_id">
          <option value="">Husstand / fælles</option>
          {% for person in people %}
          <option value="{{ person.id }}" {% if item and item.person_id == person.id %}selected{% endif %}>{{ person.name }}</option>
          {% endfor %}
        </select>
      </label>
      <label>
        Fra konto
        <select name="from_account_id">
          <option value=""></option>
          {% for account in accounts %}
          <option value="{{ account.id }}" {% if item and item.from_account_id == account.id %}selected{% endif %}>{{ account.name }}</option>
          {% endfor %}
        </select>
      </label>
      <label>
        Til konto
        <select name="to_account_id">
          <option value=""></option>
          {% for account in accounts %}
          <option value="{{ account.id }}" {% if item and item.to_account_id == account.id %}selected{% endif %}>{{ account.name }}</option>
          {% endfor %}
        </select>
      </label>
    </div>
    <div class="row">
      <label>
        Kategori
        <input name="category" value="{{ item.category if item else '' }}" placeholder="bolig, abonnement, løn…">
      </label>
      <label>
        n8n / eksternt id
        <input name="external_id" value="{{ item.external_id if item else '' }}" placeholder="valgfrit, bruges til idempotens">
      </label>
    </div>
    <label>
      Note
      <textarea name="notes" rows="2">{{ item.notes if item else '' }}</textarea>
    </label>
    <label class="check">
      <input type="checkbox" name="active" value="1" {% if not item or item.active %}checked{% endif %}>
      Aktiv (fjern flueben for pause uden at slette)
    </label>
    <div class="actions">
      <button class="btn" type="submit">Gem</button>
      <a class="btn ghost" href="/poster">Annuller</a>
    </div>
  </form>
</section>
<script src="/static/form.js"></script>
{% endblock %}
