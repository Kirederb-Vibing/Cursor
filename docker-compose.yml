services:
  faelleskassen:
    image: ${IMAGE:-ghcr.io/kirederb-vibing/cursor:latest}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8080}:8080"
    environment:
      DATA_DIR: /data
      TZ: ${TZ:-Europe/Copenhagen}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      API_KEY: ${API_KEY:-}
      SEED_DEMO: ${SEED_DEMO:-false}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
    volumes:
      - faelleskassen-data:/data
    restart: unless-stopped

volumes:
  faelleskassen-data:
