services:
  faelleskassen:
    image: ${IMAGE:-ghcr.io/kirederb-vibing/cursor:latest}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8080}:8080"
    environment:
      DATA_DIR: /data
      TZ: ${TZ:-Europe/Copenhagen}
      API_KEY: ${API_KEY:-}
      APP_PASSWORD: ${APP_PASSWORD:-}
      SEED_DEMO: ${SEED_DEMO:-true}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
    volumes:
      - faelleskassen-data:/data
    restart: unless-stopped

volumes:
  faelleskassen-data:
